name: CodePush Deployment

on:
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'App.tsx'
      - 'index.js'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to deploy (android, ios, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - android
          - ios
          - both
      environment:
        description: 'Environment (staging or production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-android:
    name: Deploy Android to CodePush
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      (github.event_name == 'push' || 
       (github.event_name == 'workflow_dispatch' && 
        (github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install CodePush CLI
        run: npm install -g code-push-cli

      - name: Authenticate with CodePush
        env:
          CODEPUSH_ACCESS_TOKEN: ${{ secrets.CODEPUSH_ACCESS_TOKEN }}
        run: |
          if [ -z "$CODEPUSH_ACCESS_TOKEN" ]; then
            echo "Error: CODEPUSH_ACCESS_TOKEN secret is not set"
            exit 1
          fi
          code-push login --accessKey $CODEPUSH_ACCESS_TOKEN

      - name: Determine deployment environment
        id: env
        if: steps.check_config.outputs.configured == 'true'
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo "environment=Production" >> $GITHUB_OUTPUT
            DEPLOYMENT_KEY="${{ secrets.CODEPUSH_ANDROID_PRODUCTION_KEY }}"
            if [ -z "$DEPLOYMENT_KEY" ]; then
              echo "deployment_key=" >> $GITHUB_OUTPUT
              echo "⚠️ Production deployment key not set, using Staging key"
              DEPLOYMENT_KEY="${{ secrets.CODEPUSH_ANDROID_STAGING_KEY }}"
            fi
            echo "deployment_key=$DEPLOYMENT_KEY" >> $GITHUB_OUTPUT
          else
            echo "environment=Staging" >> $GITHUB_OUTPUT
            DEPLOYMENT_KEY="${{ secrets.CODEPUSH_ANDROID_STAGING_KEY }}"
            if [ -z "$DEPLOYMENT_KEY" ]; then
              echo "deployment_key=" >> $GITHUB_OUTPUT
              echo "⚠️ Staging deployment key not set"
            else
              echo "deployment_key=$DEPLOYMENT_KEY" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Deploy to CodePush (Android)
        if: steps.check_config.outputs.configured == 'true' && steps.env.outputs.deployment_key != ''
        env:
          DEPLOYMENT_KEY: ${{ steps.env.outputs.deployment_key }}
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
        run: |
          code-push release-react \
            NsxDemo-Android \
            android \
            --deploymentKey "$DEPLOYMENT_KEY" \
            --description "CI/CD Deploy: ${{ github.sha }} - ${{ github.ref_name }} - $ENVIRONMENT" \
            --mandatory false \
            --targetBinaryVersion "*" \
            --rollout 100

      - name: Skip Deployment - Missing Configuration
        if: steps.check_config.outputs.configured == 'false' || steps.env.outputs.deployment_key == ''
        run: |
          echo "⏭️ Skipping CodePush deployment"
          echo ""
          echo "## CodePush Deployment Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_config.outputs.configured }}" == "false" ]; then
            echo "**Reason:** CodePush is not configured" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Setup Required:" >> $GITHUB_STEP_SUMMARY
            echo "1. Create Microsoft App Center account: https://appcenter.ms/" >> $GITHUB_STEP_SUMMARY
            echo "2. Register your apps in App Center" >> $GITHUB_STEP_SUMMARY
            echo "3. Get deployment keys and access token" >> $GITHUB_STEP_SUMMARY
            echo "4. Add secrets to GitHub: Settings → Secrets → Actions" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📚 See `.github/CODEPUSH_SETUP.md` for detailed instructions" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Reason:** Deployment key not configured for this environment" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Add the deployment key secret to enable CodePush deployment." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Deployment Summary
        if: steps.check_config.outputs.configured == 'true' && steps.env.outputs.deployment_key != ''
        run: |
          echo "## Android CodePush Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ✅ Deployed successfully" >> $GITHUB_STEP_SUMMARY

  deploy-ios:
    name: Deploy iOS to CodePush
    runs-on: macos-latest
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      (github.event_name == 'push' || 
       (github.event_name == 'workflow_dispatch' && 
        (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install CodePush CLI
        run: npm install -g code-push-cli

      - name: Authenticate with CodePush
        env:
          CODEPUSH_ACCESS_TOKEN: ${{ secrets.CODEPUSH_ACCESS_TOKEN }}
        run: |
          if [ -z "$CODEPUSH_ACCESS_TOKEN" ]; then
            echo "Error: CODEPUSH_ACCESS_TOKEN secret is not set"
            exit 1
          fi
          code-push login --accessKey $CODEPUSH_ACCESS_TOKEN

      - name: Determine deployment environment
        id: env
        if: steps.check_config.outputs.configured == 'true'
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo "environment=Production" >> $GITHUB_OUTPUT
            DEPLOYMENT_KEY="${{ secrets.CODEPUSH_IOS_PRODUCTION_KEY }}"
            if [ -z "$DEPLOYMENT_KEY" ]; then
              echo "deployment_key=" >> $GITHUB_OUTPUT
              echo "⚠️ Production deployment key not set, using Staging key"
              DEPLOYMENT_KEY="${{ secrets.CODEPUSH_IOS_STAGING_KEY }}"
            fi
            echo "deployment_key=$DEPLOYMENT_KEY" >> $GITHUB_OUTPUT
          else
            echo "environment=Staging" >> $GITHUB_OUTPUT
            DEPLOYMENT_KEY="${{ secrets.CODEPUSH_IOS_STAGING_KEY }}"
            if [ -z "$DEPLOYMENT_KEY" ]; then
              echo "deployment_key=" >> $GITHUB_OUTPUT
              echo "⚠️ Staging deployment key not set"
            else
              echo "deployment_key=$DEPLOYMENT_KEY" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Deploy to CodePush (iOS)
        if: steps.check_config.outputs.configured == 'true' && steps.env.outputs.deployment_key != ''
        env:
          DEPLOYMENT_KEY: ${{ steps.env.outputs.deployment_key }}
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
        run: |
          code-push release-react \
            NsxDemo-iOS \
            ios \
            --deploymentKey "$DEPLOYMENT_KEY" \
            --description "CI/CD Deploy: ${{ github.sha }} - ${{ github.ref_name }} - $ENVIRONMENT" \
            --mandatory false \
            --targetBinaryVersion "*" \
            --rollout 100

      - name: Skip Deployment - Missing Configuration
        if: steps.check_config.outputs.configured == 'false' || steps.env.outputs.deployment_key == ''
        run: |
          echo "⏭️ Skipping CodePush deployment"
          echo ""
          echo "## CodePush Deployment Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_config.outputs.configured }}" == "false" ]; then
            echo "**Reason:** CodePush is not configured" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Setup Required:" >> $GITHUB_STEP_SUMMARY
            echo "1. Create Microsoft App Center account: https://appcenter.ms/" >> $GITHUB_STEP_SUMMARY
            echo "2. Register your apps in App Center" >> $GITHUB_STEP_SUMMARY
            echo "3. Get deployment keys and access token" >> $GITHUB_STEP_SUMMARY
            echo "4. Add secrets to GitHub: Settings → Secrets → Actions" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📚 See `.github/CODEPUSH_SETUP.md` for detailed instructions" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Reason:** Deployment key not configured for this environment" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Add the deployment key secret to enable CodePush deployment." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Deployment Summary
        if: steps.check_config.outputs.configured == 'true' && steps.env.outputs.deployment_key != ''
        run: |
          echo "## iOS CodePush Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ✅ Deployed successfully" >> $GITHUB_STEP_SUMMARY

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-android, deploy-ios]
    if: always()

    steps:
      - name: Final Summary
        run: |
          echo "## CodePush Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Android" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.deploy-android.result }}" == "success" ]; then
            echo "- Status: ✅ Deployed successfully" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-android.result }}" == "skipped" ]; then
            echo "- Status: ⏭️ Skipped (CodePush not configured)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Status: ⚠️ ${{ needs.deploy-android.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### iOS" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.deploy-ios.result }}" == "success" ]; then
            echo "- Status: ✅ Deployed successfully" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-ios.result }}" == "skipped" ]; then
            echo "- Status: ⏭️ Skipped (CodePush not configured)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Status: ⚠️ ${{ needs.deploy-ios.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.deploy-android.result }}" == "success" ] || [ "${{ needs.deploy-ios.result }}" == "success" ]; then
            echo "**✅ Deployment completed. Users will receive updates automatically.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**ℹ️ CodePush is not configured. Workflow completed successfully without deployment.**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To enable CodePush deployment:" >> $GITHUB_STEP_SUMMARY
            echo "1. Create App Center account: https://appcenter.ms/" >> $GITHUB_STEP_SUMMARY
            echo "2. Add secrets: Settings → Secrets → Actions" >> $GITHUB_STEP_SUMMARY
            echo "3. See `.github/CODEPUSH_SETUP.md` for details" >> $GITHUB_STEP_SUMMARY
          fi

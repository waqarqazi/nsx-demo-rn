name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # This job must pass for PRs to be mergeable
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Check formatting
        run: npm run format:check
        continue-on-error: false

      - name: Type check
        run: npm run type-check
        continue-on-error: false

      - name: Run unit tests
        run: npm run test:coverage
        continue-on-error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  e2e-tests:
    name: E2E Tests
    runs-on: macos-latest
    # Run E2E tests on PRs and dev branch
    if: github.ref == 'refs/heads/dev' || github.event_name == 'pull_request'
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build for E2E testing
        run: |
          # Build Android APK for testing
          cd android
          ./gradlew assembleDebug

      - name: Run Detox E2E tests
        run: |
          npm run detox:build
          npm run detox:test
        continue-on-error: false # Fail CI if E2E tests fail - required for merge

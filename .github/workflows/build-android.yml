name: Build Android

on:
  push:
    branches: [main, dev]
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
      environment:
        description: 'Environment (dev or production)'
        required: true
        default: 'production'
        type: choice
        options:
          - dev
          - production

jobs:
  build-android-dev:
    name: Build Android (Dev)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env file for dev
        run: |
          cp .env.example .env || echo "Creating default .env"
          echo "APP_ENV=dev" >> .env
          echo "NODE_ENV=development" >> .env

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-dev
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Generate Build Info
        run: |
          echo "BUILD_TYPE=debug" >> $GITHUB_ENV
          echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          echo "BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV

  build-android-production:
    name: Build Android (Production)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env file for production
        run: |
          cp .env.example .env || echo "Creating default .env"
          echo "APP_ENV=production" >> .env
          echo "NODE_ENV=production" >> .env

      - name: Setup Android Keystore
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            echo "keystorePassword=$KEYSTORE_PASSWORD" >> android/gradle.properties
            echo "keyAlias=$KEY_ALIAS" >> android/gradle.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/gradle.properties
          fi

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build Android Release AAB (for Play Store)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-production
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab-production
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Generate Build Info
        run: |
          echo "BUILD_TYPE=release" >> $GITHUB_ENV
          echo "ENVIRONMENT=production" >> $GITHUB_ENV
          echo "BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "VERSION_NAME=$(node -p \"require('./package.json').version\")" >> $GITHUB_ENV

      - name: Create Release Notes
        if: github.ref == 'refs/heads/main'
        run: |
          echo "## Android Production Build" >> release_notes.md
          echo "- Version: $(node -p \"require('./package.json').version\")" >> release_notes.md
          echo "- Commit: ${{ github.sha }}" >> release_notes.md
          echo "- Branch: ${{ github.ref_name }}" >> release_notes.md
          echo "- Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> release_notes.md

      - name: Upload Release Notes
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

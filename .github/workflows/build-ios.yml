name: Build iOS

on:
  push:
    branches: [main, dev]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
      environment:
        description: 'Environment (dev or production)'
        required: true
        default: 'production'
        type: choice
        options:
          - dev
          - production

jobs:
  build-ios-dev:
    name: Build iOS (Dev)
    runs-on: macos-latest
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env file for dev
        run: |
          cp .env.example .env || echo "Creating default .env"
          echo "APP_ENV=dev" >> .env
          echo "NODE_ENV=development" >> .env

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          bundle install
          bundle exec pod install

      - name: Build iOS Debug
        run: |
          cd ios
          xcodebuild -workspace NsxDemo.xcworkspace \
            -scheme NsxDemo \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -allowProvisioningUpdates

      - name: Archive iOS Debug
        run: |
          cd ios
          xcodebuild archive \
            -workspace NsxDemo.xcworkspace \
            -scheme NsxDemo \
            -configuration Debug \
            -archivePath build/NsxDemo.xcarchive \
            -sdk iphonesimulator \
            -allowProvisioningUpdates

      - name: Export IPA (Debug)
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath build/NsxDemo.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist || echo "Export options not configured"

      - name: Upload Debug IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-ipa-dev
          path: ios/build/export/*.ipa
          retention-days: 7
        continue-on-error: true

      - name: Generate Build Info
        run: |
          echo "BUILD_TYPE=debug" >> $GITHUB_ENV
          echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          echo "BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV

  build-ios-production:
    name: Build iOS (Production)
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env file for production
        run: |
          cp .env.example .env || echo "Creating default .env"
          echo "APP_ENV=production" >> .env
          echo "NODE_ENV=production" >> .env

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          bundle install
          bundle exec pod install

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Apple Certificate and Provisioning Profile
        if: github.ref == 'refs/heads/main'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > certificate.p12
            security create-keychain -p "" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "" build.keychain
            security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          fi
          if [ -n "$APPLE_PROVISIONING_PROFILE_BASE64" ]; then
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          fi

      - name: Build iOS Release
        run: |
          cd ios
          xcodebuild -workspace NsxDemo.xcworkspace \
            -scheme NsxDemo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -allowProvisioningUpdates

      - name: Archive iOS Release
        run: |
          cd ios
          xcodebuild archive \
            -workspace NsxDemo.xcworkspace \
            -scheme NsxDemo \
            -configuration Release \
            -archivePath build/NsxDemo.xcarchive \
            -sdk iphoneos \
            -allowProvisioningUpdates

      - name: Export IPA (Release)
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath build/NsxDemo.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist || echo "Export options not configured"

      - name: Upload Release IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa-production
          path: ios/build/export/*.ipa
          retention-days: 30
        continue-on-error: true

      - name: Generate Build Info
        run: |
          echo "BUILD_TYPE=release" >> $GITHUB_ENV
          echo "ENVIRONMENT=production" >> $GITHUB_ENV
          echo "BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "VERSION_NAME=$(node -p \"require('./package.json').version\")" >> $GITHUB_ENV

      - name: Create Release Notes
        if: github.ref == 'refs/heads/main'
        run: |
          echo "## iOS Production Build" >> release_notes.md
          echo "- Version: $(node -p \"require('./package.json').version\")" >> release_notes.md
          echo "- Commit: ${{ github.sha }}" >> release_notes.md
          echo "- Branch: ${{ github.ref_name }}" >> release_notes.md
          echo "- Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> release_notes.md

      - name: Upload Release Notes
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-ios
          path: release_notes.md
